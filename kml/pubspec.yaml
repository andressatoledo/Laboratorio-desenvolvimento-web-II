name: kml
description: KML - Quilômetros e lucratividade. Controle financeiro para motoristas autônomos.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  sqflite: ^2.3.3   # banco SQLite local
  shared_preferences: ^2.2.3  # guarda a preferência de tema
  path: ^1.9.0      # monta o caminho do arquivo do banco
  intl: any         # datas e moeda em pt_BR (versão definida pelo Flutter)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/kml_logo.png
